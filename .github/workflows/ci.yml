name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.model }})
    strategy:
      matrix:
        model: [test_model, wpl9, wpl10ac, wpl13e, wpl17, wpf10, ttl33, wpl18e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and run tests
        run: make test MODEL_TEST_FLAGS=-DHA_DEVICE_MODEL=${{ matrix.model }}

      - name: Verify test count (regression guard)
        run: |
          COUNT=$(./tests/run_tests --reporter compact 2>&1 | grep -c "passed")
          echo "Test assertions passing: $COUNT"

  compile-s3:
    name: Compile ESP32-S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.10.1

      - name: Cache ESP-IDF toolchain and framework
        uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-idf-esphome-2026.10.1
          restore-keys: esphome-idf-

      - name: Use CI secrets
        run: cp esphome/ci_secrets.yaml esphome/secrets.yaml

      - name: Compile (ESP32-S3)
        run: esphome compile esphome/ci_heatingpump_s3.yaml

      - name: Compile (ESP32-S3, English)
        run: esphome -s language EN compile esphome/ci_heatingpump_s3.yaml

      - name: Check package layout (includes resolve without a local ha-stiebel-control folder)
        run: |
          mkdir -p /tmp/layout/config
          cp -r esphome/ha-stiebel-control /tmp/layout/pkg
          cp esphome/ci_secrets.yaml /tmp/layout/config/secrets.yaml
          sed 's#!include ha-stiebel-control/#!include ../pkg/#' esphome/ci_heatingpump_s3.yaml > /tmp/layout/config/layout.yaml
          esphome config /tmp/layout/config/layout.yaml > /dev/null

      - name: Compile (ESP32-S3, read_only)
        run: esphome -s read_only true compile esphome/ci_heatingpump_s3.yaml

  compile-wpl9:
    name: Compile WPL9 (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome==2026.10.1
      - name: Cache ESP-IDF toolchain and framework
        uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-idf-esphome-2026.10.1
          restore-keys: esphome-idf-
      - run: cp esphome/ci_secrets.yaml esphome/secrets.yaml
      - run: esphome compile esphome/ci_heatingpump_wpl9.yaml

  compile-esp32:
    name: Compile ESP32 (MCP2515)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.10.1

      - name: Cache ESP-IDF toolchain and framework
        uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-idf-esphome-2026.10.1
          restore-keys: esphome-idf-

      - name: Use CI secrets
        run: cp esphome/ci_secrets.yaml esphome/secrets.yaml

      - name: Compile (ESP32 esp32dev + MCP2515)
        run: esphome compile esphome/ci_heatingpump_esp32.yaml

      - name: Validate deprecated board_esp32s2.yaml alias
        run: esphome config esphome/ci_heatingpump_s2.yaml > /dev/null

  release:
    name: GitHub Release
    needs: [compile-s3, compile-esp32]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.10.1

      - name: Use CI secrets
        run: cp esphome/ci_secrets.yaml esphome/secrets.yaml

      - name: Verify S3 firmware compiles
        run: esphome compile esphome/ci_heatingpump_s3.yaml

      - name: Verify ESP32 (MCP2515) firmware compiles
        run: esphome compile esphome/ci_heatingpump_esp32.yaml

      - name: Extract release notes
        run: |
          python3 - <<'EOF'
          import os, re, sys
          text = open("CHANGELOG.md").read()
          # The section of the tagged version, up to the next ## heading
          # (an empty "## [Unreleased]" above it is skipped).
          version = re.escape(os.environ["GITHUB_REF_NAME"].lstrip("v"))
          m = re.search(r'(## \[' + version + r'\].*?)(?=\n## \[|\Z)', text, re.DOTALL)
          if not m:
              print("Could not extract release notes", file=sys.stderr)
              sys.exit(1)
          open("release_notes.md", "w").write(m.group(1).strip())
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          # No firmware binaries attached — they are compiled with placeholder credentials
          # and would be unusable and potentially dangerous for end users.
          # Users must compile their own firmware with their own secrets.yaml.

  validate-yaml:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install yamllint paho-mqtt

      - name: Validate MQTT model manifests
        run: python3 -m unittest discover -s tests -p 'test_mqtt_manifest.py'

      - name: Validate YAML files
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 120}}}' \
            esphome/ha-stiebel-control/*.yaml \
            packages/*.yaml
