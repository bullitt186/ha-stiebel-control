esphome:
  name: heatingpump
  friendly_name: "Heating Pump CAN Interface"
  project:
    name: "bullitt186.ha-stiebel-control"
    version: "2.2.0"
  on_boot:
    priority: 600
    then:
      - lambda: |-
          initBoostStatePrefs();
          loadBoostState();
  includes:
    - ha-stiebel-control/elster/ElsterTable.h
    - ha-stiebel-control/elster/KElsterTable.h
    - ha-stiebel-control/elster/KElsterTable.cpp
    - ha-stiebel-control/elster/NUtils.h
    - ha-stiebel-control/elster/NUtils.cpp
    - ha-stiebel-control/elster/NTypes.h
    - ha-stiebel-control/config.h
    # Language files MUST be listed: ESPHome copies them into src/ and
    # language_select.h includes them by name. lang_en.h's overrides are guarded
    # by HA_LANGUAGE_EN, so the German default is unaffected even though ESPHome
    # auto-includes the file into the main translation unit.
    - ha-stiebel-control/language_select.h
    - ha-stiebel-control/lang_base.h
    - ha-stiebel-control/lang_en.h
    - ha-stiebel-control/sg_ready_controller.h
    - ha-stiebel-control/ha-stiebel-control.h
    - ha-stiebel-control/signal_requests_base.h
    # model-specific signal_requests_*.h is declared by each model yaml package
  platformio_options:
    build_flags:
      - "-DHA_DEVICE_MODEL=${device_model}"
      - "-DHA_MODEL_${device_model}"
      - "-DHA_LANGUAGE_${language}"


#########################################
#                                       #
#   LOGGER                              #
#                                       #
#########################################
logger:
  level: INFO
  baud_rate: 115200


#########################################
#                                       #
#   API & OTA                           #
#                                       #
#########################################
api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

safe_mode:
  reboot_timeout: 5min

#########################################
#                                       #
#   MQTT                                #
#                                       #
#########################################
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  id: mqtt_client
  # Disable native ESPHome discovery - using custom auto-discovery instead
  discovery: false
  discovery_prefix: homeassistant
  # Birth message - sent when ESP32 connects
  birth_message:
    topic: heatingpump/status
    payload: online
    qos: 1
    retain: true
  # Last Will Testament - sent by broker if ESP32 disconnects unexpectedly
  will_message:
    topic: heatingpump/status
    payload: offline
    qos: 1
    retain: true
  # Keepalive for connection monitoring
  keepalive: 15s
  # Disable reboot on MQTT disconnect - will keep trying to reconnect indefinitely
  reboot_timeout: 600s
  on_connect:
    - logger.log:
        level: INFO
        format: "Connected to MQTT broker"
        tag: "MQTT_CONN"
    - lambda: |-
        ESP_LOGI("MQTT_CONN", "Publishing writable entity discoveries...");
        // Publish the SG Ready state control first (appears at the top), then
        // the writable number settings, then the operating-mode select.
        publishWritableSelectDiscoveryByName("SG_READY_STATE");
        publishAllWritableNumberDiscoveries();
        publishWritableSelectDiscoveryByName("PROGRAMMSCHALTER");
        // Datetime control now handled by Home Assistant input_datetime helpers
        ESP_LOGI("MQTT_CONN", "Discovery publication complete");

        // Publish initial states for SG Ready controls (retained)
        ESP_LOGI("MQTT_CONN", "Publishing initial SG Ready states...");
        publishSgReadyStates();
        id(SG_READY_CURRENT_STATE).publish_state(
          currentSgReadyState == 0 ? "Deaktiviert" :
          currentSgReadyState == 1 ? "1 - EVU Sperre" :
          currentSgReadyState == 2 ? "2 - Normal" :
          currentSgReadyState == 3 ? "3 - Empfohlen" :
          currentSgReadyState == 4 ? "4 - Zwang" : "Unbekannt"
        );
        ESP_LOGI("MQTT_CONN", "Initial SG Ready states published");
  on_disconnect:
    - logger.log:
        level: WARN
        format: "Disconnected from MQTT broker - will automatically retry"
  on_message:
    - topic: heatingpump/reconnect
      then:
        - logger.log: "Manual reconnect triggered"

    # Force republish all discoveries (including writable entities)
    - topic: heatingpump/republish_discoveries
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Manual discovery republish triggered");
            republishAllDiscoveries();
            publishAllWritableNumberDiscoveries(true);
            publishAllWritableSelectDiscoveries(true);
            publishAllCalculatedSensorDiscoveries(true);
            ESP_LOGI("MQTT_CMD", "All discoveries republished");

    # Normal DHW (WW) setpoint — writes BOTH Einstell registers so they stay in
    # sync (the WPM3 active setpoint follows one of them internally)
    - topic: heatingpump/MANAGER/WW_SOLL/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received WW_SOLL command: %s", x.c_str());
            publishWritableNumberDiscoveryByName("WW_SOLL");
            const char* value = x.c_str();
            writeCanSignalRouted("EINSTELL_SPEICHERSOLLTEMP", value);
            writeCanSignalRouted("EINSTELL_SPEICHERSOLLTEMP2", value);
            publishMqttChecked("heatingpump/MANAGER/WW_SOLL/state", value, strlen(value), 0, true);

    # Normal room setpoint — writes RAUMSOLLTEMP_I (manager)
    - topic: heatingpump/MANAGER/RAUM_SOLL/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received RAUM_SOLL command: %s", x.c_str());
            publishWritableNumberDiscoveryByName("RAUM_SOLL");
            const char* value = x.c_str();
            writeSignal(&CanMembers[cm_manager], "RAUMSOLLTEMP_I", value);
            readSignal(&CanMembers[cm_manager], "RAUMSOLLTEMP_I");

    # Operating mode control
    - topic: heatingpump/MANAGER/PROGRAMMSCHALTER/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received PROGRAMMSCHALTER command: %s", x.c_str());
            // Ensure discovery is published
            publishWritableSelectDiscoveryByName("PROGRAMMSCHALTER");
            // Write to CAN bus
            const char* value = x.c_str();
            writeSignal(&CanMembers[cm_manager], "PROGRAMMSCHALTER", value);
            // Read back to update state
            readSignal(&CanMembers[cm_manager], "PROGRAMMSCHALTER");

    # SG Ready state control
    - topic: heatingpump/MANAGER/SG_READY_STATE/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received SG_READY_STATE command: %s", x.c_str());
            // Ensure discovery is published
            publishWritableSelectDiscoveryByName("SG_READY_STATE");

            // Parse the state from the string (format: "1 - EVU Sperre", "2 - Normal", etc.)
            int state = 0;
            if (x.find("1 - ") == 0) state = 1;
            else if (x.find("2 - ") == 0) state = 2;
            else if (x.find("3 - ") == 0) state = 3;
            else if (x.find("4 - ") == 0) state = 4;

            if (state >= 1 && state <= 4) {
                applySgReadyState(state);
            } else {
                ESP_LOGW("MQTT_CMD", "Invalid SG Ready state received: %s", x.c_str());
            }

    # SG Ready boost temperature for State 3
    - topic: heatingpump/MANAGER/SG_READY_BOOST_STATE3/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received SG_READY_BOOST_STATE3 command: %s", x.c_str());
            // Ensure discovery is published
            publishWritableNumberDiscoveryByName("SG_READY_BOOST_STATE3");
            // Parse and store the boost value
            char* endPtr;
            float boost = strtof(x.c_str(), &endPtr);
            if (endPtr != x.c_str() && *endPtr == '\0' && boost >= 0.0 && boost <= 10.0) {
                setSgReadyBoost3(boost);
                ESP_LOGI("SG_READY", "State 3 boost set to %.1f°C", boost);
                // Publish state back
                char stateTopic[128];
                snprintf(stateTopic, sizeof(stateTopic), "heatingpump/MANAGER/SG_READY_BOOST_STATE3/state");
                char valueStr[16];
                snprintf(valueStr, sizeof(valueStr), "%.1f", sgReadyBoostState3Value());
                publishMqttChecked(stateTopic, valueStr, strlen(valueStr), 0, true);
            } else {
                ESP_LOGW("MQTT_CMD", "Invalid boost value: %s", x.c_str());
            }

    # SG Ready boost temperature for State 4
    - topic: heatingpump/MANAGER/SG_READY_BOOST_STATE4/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received SG_READY_BOOST_STATE4 command: %s", x.c_str());
            // Ensure discovery is published
            publishWritableNumberDiscoveryByName("SG_READY_BOOST_STATE4");
            // Parse and store the boost value
            char* endPtr;
            float boost = strtof(x.c_str(), &endPtr);
            if (endPtr != x.c_str() && *endPtr == '\0' && boost >= 0.0 && boost <= 15.0) {
                setSgReadyBoost4(boost);
                ESP_LOGI("SG_READY", "State 4 boost set to %.1f°C", boost);
                // Publish state back
                char stateTopic[128];
                snprintf(stateTopic, sizeof(stateTopic), "heatingpump/MANAGER/SG_READY_BOOST_STATE4/state");
                char valueStr[16];
                snprintf(valueStr, sizeof(valueStr), "%.1f", sgReadyBoostState4Value());
                publishMqttChecked(stateTopic, valueStr, strlen(valueStr), 0, true);
            } else {
                ESP_LOGW("MQTT_CMD", "Invalid boost value: %s", x.c_str());
            }

    # SG Ready room boost offset for State 3
    - topic: heatingpump/MANAGER/SG_READY_ROOM_BOOST_STATE3/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received SG_READY_ROOM_BOOST_STATE3 command: %s", x.c_str());
            publishWritableNumberDiscoveryByName("SG_READY_ROOM_BOOST_STATE3");
            char* endPtr;
            float boost = strtof(x.c_str(), &endPtr);
            if (endPtr != x.c_str() && *endPtr == '\0' && boost >= 0.0 && boost <= 5.0) {
                setSgReadyRoomBoost3(boost);
                ESP_LOGI("SG_READY", "Room boost state 3 set to %.1f°C", boost);
                char stateTopic[128];
                snprintf(stateTopic, sizeof(stateTopic), "heatingpump/MANAGER/SG_READY_ROOM_BOOST_STATE3/state");
                char valueStr[16];
                snprintf(valueStr, sizeof(valueStr), "%.1f", sgReadyRoomBoost3Value());
                publishMqttChecked(stateTopic, valueStr, strlen(valueStr), 0, true);
            } else {
                ESP_LOGW("MQTT_CMD", "Invalid room boost value: %s", x.c_str());
            }

    # SG Ready room boost offset for State 4
    - topic: heatingpump/MANAGER/SG_READY_ROOM_BOOST_STATE4/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received SG_READY_ROOM_BOOST_STATE4 command: %s", x.c_str());
            publishWritableNumberDiscoveryByName("SG_READY_ROOM_BOOST_STATE4");
            char* endPtr;
            float boost = strtof(x.c_str(), &endPtr);
            if (endPtr != x.c_str() && *endPtr == '\0' && boost >= 0.0 && boost <= 5.0) {
                setSgReadyRoomBoost4(boost);
                ESP_LOGI("SG_READY", "Room boost state 4 set to %.1f°C", boost);
                char stateTopic[128];
                snprintf(stateTopic, sizeof(stateTopic), "heatingpump/MANAGER/SG_READY_ROOM_BOOST_STATE4/state");
                char valueStr[16];
                snprintf(valueStr, sizeof(valueStr), "%.1f", sgReadyRoomBoost4Value());
                publishMqttChecked(stateTopic, valueStr, strlen(valueStr), 0, true);
            } else {
                ESP_LOGW("MQTT_CMD", "Invalid room boost value: %s", x.c_str());
            }

    # Room temperature setpoints for heating circuits 1–3 and night/reduced mode
    - topic: heatingpump/MANAGER/RAUMSOLLTEMP_I/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received RAUMSOLLTEMP_I command: %s", x.c_str());
            publishWritableNumberDiscoveryByName("RAUMSOLLTEMP_I");
            const char* value = x.c_str();
            writeSignal(&CanMembers[cm_manager], "RAUMSOLLTEMP_I", value);
            readSignal(&CanMembers[cm_manager], "RAUMSOLLTEMP_I");

    - topic: heatingpump/MANAGER/RAUMSOLLTEMP_II/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received RAUMSOLLTEMP_II command: %s", x.c_str());
            publishWritableNumberDiscoveryByName("RAUMSOLLTEMP_II");
            const char* value = x.c_str();
            writeSignal(&CanMembers[cm_manager], "RAUMSOLLTEMP_II", value);
            readSignal(&CanMembers[cm_manager], "RAUMSOLLTEMP_II");

    - topic: heatingpump/MANAGER/RAUMSOLLTEMP_III/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received RAUMSOLLTEMP_III command: %s", x.c_str());
            publishWritableNumberDiscoveryByName("RAUMSOLLTEMP_III");
            const char* value = x.c_str();
            writeSignal(&CanMembers[cm_manager], "RAUMSOLLTEMP_III", value);
            readSignal(&CanMembers[cm_manager], "RAUMSOLLTEMP_III");

    - topic: heatingpump/MANAGER/RAUMSOLLTEMP_NACHT/set
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Received RAUMSOLLTEMP_NACHT command: %s", x.c_str());
            publishWritableNumberDiscoveryByName("RAUMSOLLTEMP_NACHT");
            const char* value = x.c_str();
            writeSignal(&CanMembers[cm_manager], "RAUMSOLLTEMP_NACHT", value);
            readSignal(&CanMembers[cm_manager], "RAUMSOLLTEMP_NACHT");

    # Set WPM date AND time in one go (notes: WPM clock drifts; sync periodically)
    # Payload: "YYYY-MM-DD HH:MM:SS" (strictly validated, no partial writes)
    - topic: heatingpump/DATETIME/set
      then:
        - lambda: |-
            updateDateTime(x.c_str());


#########################################
#                                       #
#   INTERVAL TIMER                      #
#                                       #
#########################################
interval:
  # Process signal requests based on request table (runs every second)
  - interval: 1s
    then:
      - lambda: |-
          processSignalRequests();

  # Process calculated sensor updates (runs every second)
  - interval: 1s
    then:
      - lambda: |-
          processCalculatedSensors();

  # Republish SG Ready control states (retained) — these topics are otherwise
  # only written on connect/state change; a broker that lost retained messages
  # would leave HA showing the controls as unavailable. Self-heals within 60s.
  - interval: 60s
    then:
      - lambda: |-
          publishSgReadyStates();

  # Republish MQTT discovery every 15 minutes for reliability
  - interval: 15min
    then:
      - lambda: |-
          republishAllDiscoveries();
          publishAllWritableNumberDiscoveries(true);
          publishAllWritableSelectDiscoveries(true);

#########################################
#                                       #
#   DEBUG                               #
#                                       #
#########################################
debug:
  update_interval: 60s

#########################################
#                                       #
#   TEXT SENSOREN                       #
#                                       #
#########################################
text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"

  #########################################
  #                                       #
  #   BERECHNETE TEXT SENSORS             #
  #                                       #
  #########################################
  - platform: template
    name: "SG Ready Aktueller Zustand"
    id: SG_READY_CURRENT_STATE
    icon: "mdi:solar-power"
    update_interval: 5s
    lambda: |-
      if (currentSgReadyState == 0) {
        return std::string("Deaktiviert");
      } else if (currentSgReadyState == 1) {
        return std::string("1 - EVU Sperre");
      } else if (currentSgReadyState == 2) {
        return std::string("2 - Normal");
      } else if (currentSgReadyState == 3) {
        return std::string("3 - Empfohlen");
      } else if (currentSgReadyState == 4) {
        return std::string("4 - Zwang");
      } else {
        return std::string("Unbekannt");
      }

  - platform: template
    name: "DATUM"
    id: DATUM
    internal: true
    icon: "mdi:calendar"

  - platform: template
    name: "ZEIT"
    id: ZEIT
    internal: true
    icon: "mdi:clock"

#########################################
#                                       #
#   TIME (Systemzeit für WPM-Sync)      #
#                                       #
#########################################
time:
  - platform: homeassistant
    id: wpm_time
    timezone: Europe/Berlin

#########################################
#                                       #
#   BUTTON                              #
#                                       #
#########################################
button:
  - platform: template
    name: "WPM Datum & Uhrzeit übernehmen"
    id: update_uhrzeit
    icon: "mdi:clock-check"
    on_press:
      then:
        - lambda: |-
            esphome::ESPTime t = id(wpm_time).now();
            if (!t.is_valid() || t.year < 2000) {
              ESP_LOGW("SET_DATETIME", "Systemzeit noch nicht synchronisiert (Jahr=%d) — Button ignorieren", (int)t.year);
              return;
            }
            char dts[24];
            snprintf(dts, sizeof(dts), "%04d-%02d-%02d %02d:%02d:%02d",
                     (int)t.year, (int)t.month, (int)t.day_of_month, (int)t.hour, (int)t.minute, (int)t.second);
            updateDateTime(dts);

  - platform: template
    name: "Republish MQTT Discoveries"
    id: republish_mqtt_discoveries
    icon: "mdi:refresh"
    on_press:
      then:
        lambda: |-
          republishAllDiscoveries();

  - platform: restart
    name: "Restart"
    id: restart_button

  - platform: factory_reset
    name: "Factory Reset (Clear NVS)"
    icon: "mdi:restart-alert"

#########################################
#                                       #
#   WiFi & Captive Portal               #
#                                       #
#########################################
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.30.107  # production device IP for OTA
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 5min
  ap:
    ssid: "Heatingpump Fallback Hotspot"
    password: "AsBl9n46jlOx"

captive_portal:

#########################################
#                                       #
#   SENSOR                              #
#                                       #
#########################################
sensor:
  # WiFi and system sensors
  - platform: wifi_signal
    name: "WiFi Signal dBm"
    icon: "mdi:wifi"
    update_interval: 60s
    id: wifi_dbm

  - platform: template
    name: "WiFi Signal"
    icon: "mdi:signal"
    unit_of_measurement: "%"
    update_interval: 60s
    id: wifi_percentage
    lambda: |-
      float dBm = id(wifi_dbm).state;
      float MIN_DBM = -100.0; // Minimum RSSI in dBm
      float MAX_DBM = -30.0; // Maximum RSSI in dBm
      if (dBm < MIN_DBM) dBm = MIN_DBM;
      if (dBm > MAX_DBM) dBm = MAX_DBM;
      return ((dBm - MIN_DBM) / (MAX_DBM - MIN_DBM)) * 100;

  # Uptime — resets to 0 on reboot; helps diagnose disconnects (reboot vs link loss)
  - platform: uptime
    name: "Uptime"
    icon: "mdi:timer-outline"
    update_interval: 60s
    id: uptime_sensor

  # Free heap — if this trends down over time, a memory leak is killing the API
  - platform: debug
    free:
      name: "Free Heap"
      icon: "mdi:memory"

  # -----------------------------------------------------------------------
  # COP energy accumulator sensors (universal — present on all Elster models)
  # -----------------------------------------------------------------------
  - platform: template
    name: "EL_AUFNAHMELEISTUNG_HEIZ_SUM"
    id: EL_AUFNAHMELEISTUNG_HEIZ_SUM
    internal: true
    unit_of_measurement: MWh
    device_class: energy
    accuracy_decimals: 3
    state_class: "total_increasing"

  - platform: template
    name: "EL_AUFNAHMELEISTUNG_WW_SUM"
    id: EL_AUFNAHMELEISTUNG_WW_SUM
    internal: true
    unit_of_measurement: MWh
    device_class: energy
    accuracy_decimals: 3
    state_class: "total_increasing"

  - platform: template
    name: "WAERMEERTRAG_2WE_HEIZ_SUM"
    id: WAERMEERTRAG_2WE_HEIZ_SUM
    internal: true
    unit_of_measurement: MWh
    device_class: energy
    accuracy_decimals: 3
    state_class: "total_increasing"

  - platform: template
    name: "WAERMEERTRAG_2WE_WW_SUM"
    id: WAERMEERTRAG_2WE_WW_SUM
    internal: true
    unit_of_measurement: MWh
    device_class: energy
    accuracy_decimals: 3
    state_class: "total_increasing"

  - platform: template
    name: "WAERMEERTRAG_HEIZ_SUM"
    id: WAERMEERTRAG_HEIZ_SUM
    internal: true
    unit_of_measurement: MWh
    device_class: energy
    accuracy_decimals: 3
    state_class: "total_increasing"

  - platform: template
    name: "WAERMEERTRAG_WW_SUM"
    id: WAERMEERTRAG_WW_SUM
    internal: true
    unit_of_measurement: MWh
    device_class: energy
    accuracy_decimals: 3
    state_class: "total_increasing"

  # DHW and heating temperature sensors
  - platform: template
    name: "EINSTELL_SPEICHERSOLLTEMP"
    id: EINSTELL_SPEICHERSOLLTEMP
    internal: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: template
    name: "EINSTELL_SPEICHERSOLLTEMP2"
    id: EINSTELL_SPEICHERSOLLTEMP2
    internal: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: template
    name: "SPEICHERISTTEMP"
    id: SPEICHERISTTEMP
    internal: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - offset: 3.9

  - platform: template
    name: "SPEICHERSOLLTEMP"
    id: SPEICHERSOLLTEMP
    internal: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  # COP output sensors
  - platform: template
    name: "COP_WW"
    id: COP_WW
    internal: true
    device_class: "power_factor"
    accuracy_decimals: 2

  - platform: template
    name: "COP_HEIZ"
    id: COP_HEIZ
    internal: true
    device_class: "power_factor"
    accuracy_decimals: 2

  - platform: template
    name: "COP_GESAMT"
    id: COP_GESAMT
    internal: true
    device_class: "power_factor"
    accuracy_decimals: 2

  # Operating mode and season sensors — used to trigger CAN reads
  - platform: template
    name: "PROGRAMMSCHALTER"
    id: PROGRAMMSCHALTER
    internal: true
    lambda: |-
      readSignal(&CanMembers[cm_manager], "PROGRAMMSCHALTER");
      return {};

  - platform: template
    name: "SOMMERBETRIEB"
    id: SOMMERBETRIEB
    internal: true
    lambda: |-
      readSignal(&CanMembers[cm_manager], "SOMMERBETRIEB");
      return {};

  - platform: template
    name: "WW_ECO"
    id: WW_ECO
    internal: true
    lambda: |-
      readSignal(&CanMembers[cm_manager], "WW_ECO");
      return {};
