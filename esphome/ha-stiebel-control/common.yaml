# Defaults — override in your top-level heatingpump.yaml substitutions
substitutions:
  device_name: heatingpump    # ESPHome node name, hostname and root of every MQTT topic (lower case, a-z 0-9 -)
  friendly_name: "Heating Pump CAN Interface"   # ESPHome device name in Home Assistant
  disable_sg_ready: "false"   # "true" hides all SG Ready entities (e.g. WPC7, which has no SG Ready input)
  read_only: "false"          # "true": never write to the heat pump (no setpoints/modes/clock; reading and bus scan only)
  # Network package from this folder: network_wifi.yaml (default) or network_ethernet_w5500.yaml
  network_package: "network_wifi.yaml"

packages:
  network: !include ${network_package}

esphome:
  min_version: 2026.7.0
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: "bullitt186.ha-stiebel-control"
    version: "2.7.0"
  on_boot:
    priority: 600
    then:
      - lambda: |-
          initBoostStatePrefs();
          loadBoostState();
          initSummerPrefs();
          // One subscription for all set commands (#92)
          id(mqtt_client).subscribe(HA_TOPIC_ROOT "/+/+/set",
              [](const std::string &topic, const std::string &payload) { handleSetCommand(topic, payload); });
          onSgReadyChanged = []() {
            id(SG_READY_CURRENT_STATE).update();
            id(sg_ready_boost_state3_sensor).update();
            id(sg_ready_boost_state4_sensor).update();
          };
  # Paths are relative to this file, so local copies and remote packages both resolve them.
  includes:
    - elster/ElsterTable.h
    - elster/KElsterTable.h
    - elster/KElsterTable.cpp
    - elster/NUtils.h
    - elster/NUtils.cpp
    - elster/NTypes.h
    - config.h
    - model_profile.h
    - can_members.h
    # language_select.h picks the language (lang_base.h for DE, lang_en.h for EN).
    # lang_en.h must be listed so ESPHome copies it; its overrides only apply with HA_LANGUAGE_EN.
    - language_select.h
    - lang_base.h
    - lang_en.h
    - sg_ready_controller.h
    - dhw_program.h
    # Firmware modules (#109), in include order; each header includes what it needs,
    # ha-stiebel-control.h includes all of them. Listed so ESPHome copies them.
    - signal_route.h
    - mqtt_publish.h
    - can_io.h
    - paced_writes.h
    - discovery.h
    - bus_scan.h
    - request_manager.h
    - calculated.h
    - energy.h
    - writables.h
    - sg_ready_io.h
    - time_programs.h
    - set_commands.h
    - fault_list.h
    - republish.h
    - ha-stiebel-control.h
    - signal_requests_base.h
    # model-specific signal_requests_*.h is declared by each model yaml package
  build_flags:
    - "-DHA_DEVICE_MODEL=${device_model}"
    - "-DHA_DEVICE_NAME=${device_name}"
    - "-DHA_LANGUAGE_${language}"
    - "-DHA_DISABLE_SG_READY_${disable_sg_ready}"
    - "-DHA_READ_ONLY_${read_only}"

#########################################
#                                       #
#   LOGGER                              #
#                                       #
#########################################
logger:
  level: INFO
  baud_rate: 115200

# Reset-reason diagnosis for the ESP restarts seen during DHW charging
# (brownout vs. watchdog vs. software reset). Read by text_sensor platform: debug.
debug:
  update_interval: 60s

#########################################
#                                       #
#   API & OTA                           #
#                                       #
#########################################
api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

safe_mode:
  reboot_timeout: 5min

#########################################
#                                       #
#   MQTT                                #
#                                       #
#########################################
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  id: mqtt_client
  # Disable native ESPHome discovery - using custom auto-discovery instead
  discovery: false
  discovery_prefix: homeassistant
  topic_prefix: ${device_name}
  # Birth message - sent when ESP32 connects
  birth_message:
    topic: ${device_name}/status
    payload: online
    qos: 1
    retain: true
  # Last Will Testament - sent by broker if ESP32 disconnects unexpectedly
  will_message:
    topic: ${device_name}/status
    payload: offline
    qos: 1
    retain: true
  # Publish through a queue to the esp-mqtt task instead of blocking the loop for
  # up to the 10 s network timeout on a WiFi/TCP stall (task watchdog resets).
  # Messages are dropped (and counted in a WARN log) when the queue is full.
  idf_send_async: true
  # Remote log via MQTT: warnings and errors only. Per-frame CAN logs are DEBUG and
  # INFO stays on the API/serial log (esphome logs).
  log_topic:
    topic: ${device_name}/debug
    level: WARN
  # Keepalive for connection monitoring
  keepalive: 15s
  # Disable reboot on MQTT disconnect - will keep trying to reconnect indefinitely
  reboot_timeout: 0s
  on_connect:
    - logger.log:
        level: INFO
        format: "Connected to MQTT broker"
        tag: "MQTT_CONN"
    - lambda: |-
        noteMqttConnected();
        // Anything "published" during boot before the broker connection was up
        // was lost, but is already marked as discovered. Re-sends writable
        // numbers/selects, climate, calculated sensors and raw signals, paced by
        // discoveryRepublishStep() (interval below).
        republishAllDiscoveries();
        // States are published only on change (plus a 10 min heartbeat): send every
        // known value once more, after the discoveries (stateRepublishStep()).
        republishAllStates();

        // SG Ready state + boost values (retained), once the connect burst has drained
        scheduleSgReadyPublish();
        // Update sensors with initial values
        id(sg_ready_boost_state3_sensor).publish_state(sgReadyBoostState3Value());
        id(sg_ready_boost_state4_sensor).publish_state(sgReadyBoostState4Value());
        id(SG_READY_CURRENT_STATE).publish_state(sgReadyStateLabel(sgReadyController.currentState()));
  on_disconnect:
    - logger.log:
        level: WARN
        format: "Disconnected from MQTT broker - will automatically retry"
  on_message:
    - topic: ${device_name}/reconnect
      then:
        - logger.log: "Manual reconnect triggered"

    # Home Assistant birth message: HA (re)started, send all discovery configs again.
    # Replaces the former 15-minute republish (configs are retained on the broker).
    - topic: homeassistant/status
      then:
        - lambda: |-
            if (x == "online") republishAllDiscoveries();

    # Bus scan: payload "<MEMBER>" (all table indices) or "<MEMBER> 0x0000 0x0fff"
    - topic: ${device_name}/scan/start
      then:
        - lambda: startScan(x);
    - topic: ${device_name}/scan/stop
      then:
        - lambda: stopScan();

    # Force republish all discoveries (including writable entities)
    - topic: ${device_name}/republish_discoveries
      then:
        - lambda: |-
            ESP_LOGI("MQTT_CMD", "Manual discovery republish triggered");
            republishAllDiscoveries();

    # Every "<root>/<A>/<B>/set" command (writable numbers, selects, time programs) is
    # subscribed once in on_boot and dispatched by handleSetCommand() (#92).
#########################################
#                                       #
#   INTERVAL TIMER                      #
#                                       #
#########################################
interval:
  # Process signal requests based on request table (runs every second)
  - interval: 1s
    then:
      - lambda: |-
          processSignalRequests();

  # Fault list of the manager (20 entries, refreshed every 30 min)
  - interval: 1s
    then:
      - lambda: faultListStep();

  # Bus scan (idle unless started via <device_name>/scan/start)
  - interval: 150ms
    then:
      - lambda: scanStep();

  # Process calculated sensor updates (runs every second)
  - interval: 1s
    then:
      - lambda: |-
          processCalculatedSensors();

  # Keep the retained SG Ready state/boost values fresh (survive a broker restart)
  - interval: 5min
    then:
      - lambda: |-
          publishSgReadyState();

  # Sends pending discovery configs (MQTT connect, HA birth, manual trigger) a few
  # at a time, then the cached states after a (re)connect; idle otherwise. There is
  # no periodic republish: configs and states are retained. Also sends the delayed
  # read-back after SG Ready writes (one per call).
  - interval: 250ms
    then:
      - lambda: |-
          discoveryRepublishStep();
          stateRepublishStep();
          pendingReadbackStep();
          pacedWriteStep();
          sgReadyPublishStep();

#########################################
#                                       #
#   TEXT SENSOREN                       #
#                                       #
#########################################
text_sensor:
  #########################################
  #                                       #
  #   HOME ASSISTANT TEXT SENSOREN        #
  #                                       #
  #########################################
  - platform: homeassistant
    name: "Wärmepumpe Datum Setpoint"
    id: warmepumpe_datum
    entity_id: input_datetime.heatingpump_date

  - platform: homeassistant
    name: "Wärmepumpe Uhrzeit Setpoint"
    id: warmepumpe_uhrzeit
    entity_id: input_datetime.heatingpump_time

  #########################################
  #                                       #
  #   DIAGNOSE                            #
  #                                       #
  #########################################
  # Why did the ESP restart? (e.g. "Brownout", "Task watchdog", "Software reset")
  - platform: debug
    reset_reason:
      name: "Reset Grund"
      id: reset_reason_text
      entity_category: diagnostic
      icon: "mdi:restart-alert"

  #########################################
  #                                       #
  #   BERECHNETE TEXT SENSORS             #
  #                                       #
  #########################################
  - platform: template
    name: "SG Ready Aktueller Zustand"
    id: SG_READY_CURRENT_STATE
    internal: ${disable_sg_ready}
    icon: "mdi:solar-power"
    # Changes are published immediately by the SG_READY_STATE/set handler;
    # the interval only refreshes the unchanged value.
    update_interval: 60s
    lambda: |-
      return std::string(sgReadyStateLabel(sgReadyController.currentState()));

#########################################
#                                       #
#   BUTTON                              #
#                                       #
#########################################
button:
  - platform: template
    name: "Update Uhrzeit"
    internal: ${read_only}
    id: update_uhrzeit
    icon: "mdi:clock-check"
    on_press:
      then:
        lambda: |-
          updateTime(CanMembers[cm_manager], id(warmepumpe_uhrzeit).state.c_str());

  - platform: template
    name: "Update Datum"
    internal: ${read_only}
    id: update_datum
    icon: "mdi:calendar-check"
    on_press:
      then:
        lambda: |-
          updateDate(CanMembers[cm_manager], id(warmepumpe_datum).state.c_str());

  - platform: template
    name: "Republish MQTT Discoveries"
    id: republish_mqtt_discoveries
    icon: "mdi:refresh"
    on_press:
      then:
        lambda: |-
          republishAllDiscoveries();

  - platform: template
    name: "Bus-Scan Manager"
    icon: "mdi:radar"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      then:
        - lambda: startScan("MANAGER");

  - platform: template
    name: "Bus-Scan Heizmodul"
    icon: "mdi:radar"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      then:
        - lambda: startScan("HEIZMODUL");

  - platform: template
    name: "Bus-Scan Kessel"
    icon: "mdi:radar"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      then:
        - lambda: startScan("KESSEL");

  - platform: restart
    name: "Restart"
    id: restart_button

  - platform: factory_reset
    name: "Factory Reset (Clear NVS)"
    icon: "mdi:restart-alert"

#########################################
#                                       #
#   SENSOR                              #
#                                       #
#########################################
sensor:
  # SG Ready boost temperature sensors
  - platform: template
    name: "SG Ready Boost State 3"
    id: sg_ready_boost_state3_sensor
    internal: ${disable_sg_ready}
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    icon: "mdi:thermometer-plus"
    update_interval: 30s
    lambda: |-
      return sgReadyBoostState3Value();

  - platform: template
    name: "SG Ready Boost State 4"
    id: sg_ready_boost_state4_sensor
    internal: ${disable_sg_ready}
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    icon: "mdi:thermometer-plus"
    update_interval: 30s
    lambda: |-
      return sgReadyBoostState4Value();

  # Heap and loop diagnostics (classify task watchdog / memory related restarts)
  - platform: debug
    free:
      name: "Freier Heap"
      entity_category: diagnostic
      icon: "mdi:memory"
    block:
      name: "Größter freier Block"
      entity_category: diagnostic
      icon: "mdi:memory"
    loop_time:
      name: "Loop-Zeit"
      entity_category: diagnostic
      icon: "mdi:timer-sand"

  # System sensors (WiFi sensors: network_wifi.yaml)
  - platform: uptime
    name: "Betriebszeit"
    id: uptime_s
    entity_category: diagnostic
    icon: "mdi:timer-outline"

