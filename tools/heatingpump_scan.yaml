#
#  Scan firmware (DIAGNOSTIC) - development / testing only
#
#  Asks individual signals/members to reverse-engineer unknown registers or to
#  test writes. NOT a production config. For production use heatingpump.yaml with
#  `device_model: wpl17` and `sensors: !include ha-stiebel-control/wpl17.yaml`.
#
#  USAGE: copy the three files from tools/ (heatingpump_scan.yaml, scan.yaml,
#  signal_requests_scan.h) next to the existing ha-stiebel-control/ folder into
#  the ESPHome config directory, then "compile" + "install (OTA)".
#
#  NOTE: the scan firmware can write e.g. PROGRAMMSCHALTER on a live heat pump.
#  Use only with explicit approval.
#

substitutions:
  device_name: "stiebel-wp-scan"
  friendly_name: "Stiebel WP CAN Targeted Scan"
  device_model: "wpl17"
  language: "DE"
  can_tx_pin: "GPIO15"
  can_rx_pin: "GPIO16"
  can_id_pc: "0x680"
  can_bit_rate: "50kbps"            # WPL17 on CAN-B needs 50 kbps (default is 20)


esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  on_boot:
    priority: 600
    then:
      - lambda: |-
          ESP_LOGI("scan", "=== WPL17 CAN-B diagnostic scan ===");
          disableCanRequests = false;
      - delay: 3s
      - lambda: |-
          ESP_LOGI("scan", "==> Publishing discovery");
          publishAllWritableNumberDiscoveries(true);
          publishAllWritableSelectDiscoveries(true);
          publishAllCalculatedSensorDiscoveries(true);

  includes:
    - ha-stiebel-control/elster/ElsterTable.h
    - ha-stiebel-control/elster/KElsterTable.h
    - ha-stiebel-control/elster/NUtils.h
    - ha-stiebel-control/elster/NTypes.h
    - ha-stiebel-control/config.h
    - ha-stiebel-control/language_select.h
    - ha-stiebel-control/lang_base.h
    - ha-stiebel-control/signal_requests_base.h
    - ha-stiebel-control/sg_ready_controller.h
    - ha-stiebel-control/ha-stiebel-control.h


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Scan Fallback"


captive_portal:


packages:
  board: !include ha-stiebel-control/board_esp32s3.yaml
  can: !include ha-stiebel-control/can_esp32.yaml
  base: !include ha-stiebel-control/common.yaml
  sensors: !include scan.yaml


logger:
  level: INFO
  baud_rate: 0


api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_encryption_key


safe_mode:
  reboot_timeout: 5min
